# Receipt scan. The photo picker opens and cancels; the receipt itself arrives
# the way a share from Photos delivers it (the runner copies the test photo
# into the app first), because Maestro's taps cannot select inside the system
# photo picker. Reading the receipt needs a working OpenAI key on the backend.
appId: com.latchet.app
name: Receipt scan
---
- runFlow: common/home.yaml
- tapOn: "Home"
- tapOn: "Scan Receipt"
- extendedWaitUntil:
    visible: "Choose Photo"
    timeout: 10000
- takeScreenshot: 08a-receipt-start
- tapOn: "Choose Photo"
- extendedWaitUntil:
    visible: "Collections"
    timeout: 15000
- takeScreenshot: 08b-photo-picker
- tapOn:
    id: "Cancel"
- extendedWaitUntil:
    visible: "Choose Photo"
    timeout: 10000
- openLink: "latchet://receipt-scan?sharedUri=${E2E_RECEIPT_URI}"
- extendedWaitUntil:
    visible: "Review & save|Request failed.*|AI .*unavailable.*|Could not.*"
    timeout: 60000
- takeScreenshot: 08c-receipt-result
- runFlow:
    when:
      visible: "Review & save"
    commands:
      - assertVisible: "11\\.20"
