name: CI

# Everything here runs from a clean checkout, which is the whole point.
#
# category-meta.ts was once imported but untracked: every local check passed
# while a fresh clone could not have built. Local state is not evidence, so
# these jobs install from the lockfile into an empty tree and never see a
# working directory.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The suite runs against a real Postgres: test-setup.ts creates and
    # migrates latchet_test on this server itself. The same major version as
    # production's Railway service, and in Asia/Shanghai like the local server
    # the suite is developed against, so raw SQL that forgets to convert to UTC
    # fails here instead of passing on a UTC-only runner.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: Asia/Shanghai
          PGTZ: Asia/Shanghai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # env.ts exits the process on invalid config.
      BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long # gitleaks:allow (a test value)
      # The name must contain "test": test-setup.ts drops and rebuilds it.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/latchet_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile fails rather than silently resolving a different
      # tree, so a lockfile that was never committed is caught here.
      - name: Install
        run: bun install --frozen-lockfile

      # The Prisma client is generated, not committed. Without this, typecheck
      # would be checking against whatever the last generate produced locally.
      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Typecheck
        run: bun run typecheck

      - name: Postgres
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -Atc "SHOW server_version" -c "SHOW timezone"

      - name: Test
        run: bun test

      # Proves the migrations apply to an empty database in order — the state
      # a fresh deploy actually starts from, which no local run reproduces
      # once a dev database already exists.
      - name: Migrations apply from scratch
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE latchet_ci_migrations"
          bunx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/latchet_ci_migrations

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Date handling is timezone-sensitive and CI runners are UTC, which is
      # the one zone where the bugs this suite exists to catch do not appear.
      - name: Test (Asia/Shanghai, America/Los_Angeles, UTC)
        run: bun run test:tz
